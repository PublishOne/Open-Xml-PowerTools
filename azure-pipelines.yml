trigger:
- revision-processing

pool:
  vmImage: windows-latest
variables:
  BuildConfiguration: Release
steps:
- task: UseDotNet@2
  inputs:
      packageType: 'sdk'
      version: '10.0.x'
- task: NuGetAuthenticate@1
- task: DotNetCoreCLI@2
  displayName: Restore NuGet packages
  inputs:
    command: restore
    projects: |
      OpenXmlRevisions/OpenXmlRevisions.csproj
      OpenXmlRevisions.Tests/OpenXmlRevisions.Tests.csproj
    arguments: '--configuration $(BuildConfiguration)'
- task: DotNetCoreCLI@2
  displayName: Build the libraries
  inputs:
    projects: |
      OpenXmlRevisions/OpenXmlRevisions.csproj
      OpenXmlRevisions.Tests/OpenXmlRevisions.Tests.csproj
    arguments: '--configuration $(BuildConfiguration)'
- task: DotNetCoreCLI@2
  displayName: Test
  inputs:
    command: test
    projects: |
      OpenXmlRevisions.Tests/OpenXmlRevisions.Tests.csproj
    arguments: '--configuration $(BuildConfiguration)'
- task: DotNetCoreCLI@2
  displayName: Push NuGet packages
  inputs:
    command: push
    packagesToPush: '$(Build.SourcesDirectory)/**/Release/*.nupkg'
    nuGetFeedType: internal
    publishVstsFeed: '$(packagefeed)'
    allowPackageConflicts: true